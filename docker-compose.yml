version: "3.8"

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_ENV=production
        - PORT=3002
        - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3002}
    image: portfolio:latest
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const p=process.env.PORT||3002;require('http').get('http://127.0.0.1:'+p,res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1));\""]
      interval: 30s
      timeout: 3s
      retries: 3

  # Service pour le développement (optionnel)
  portfolio-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
    restart: unless-stopped
    container_name: portfolio-dev
    profiles:
      - dev
